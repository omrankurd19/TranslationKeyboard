name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: TranslationKeyboard

      - name: Build unsigned app
        run: |
          mkdir -p build
          xcodebuild build \
            -project TranslationKeyboard.xcodeproj \
            -scheme TranslationKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty || true
        working-directory: TranslationKeyboard

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name "TranslationKeyboard.app" -path "*Release-iphoneos*" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -rq TranslationKeyboard.ipa Payload
          ls -lh TranslationKeyboard.ipa
        working-directory: TranslationKeyboard

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslationKeyboard.ipa
          path: TranslationKeyboard/TranslationKeyboard.ipa
          retention-days: 90
